[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvacly"
version = "0.1.0"
description = "Validação inicial de telemetria HVACLY"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
py-modules = ["hvacly"]

[tool.pytest.ini_options]
addopts = "--cov=hvacly --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
testpaths = ["."]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
